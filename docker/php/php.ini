expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
memory_limit = 256M
upload_max_filesize = 9M
post_max_size = 45M
max_file_uploads = 10
max_input_time = 120
session.cookie_httponly = 1
session.use_strict_mode = 1
session.use_only_cookies = 1
opcache.enable = 1
opcache.validate_timestamps = 1
