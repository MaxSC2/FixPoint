name: fixpoint

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-FixPoint}
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Almaty}
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-fixpoint}
  DB_USERNAME: ${DB_USERNAME:-fixpoint}
  DB_PASSWORD: ${DB_PASSWORD:-change_me_locally}
  DB_CHARSET: ${DB_CHARSET:-utf8mb4}
  DB_WAIT_ATTEMPTS: ${DB_WAIT_ATTEMPTS:-30}
  SESSION_NAME: ${SESSION_NAME:-fixpoint_session}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_SECURE: ${SESSION_SECURE:-false}
  SESSION_SAMESITE: ${SESSION_SAMESITE:-Lax}
  CATALOG_PER_PAGE: ${CATALOG_PER_PAGE:-12}
  CONTACT_ADDRESS: ${CONTACT_ADDRESS:-}
  CONTACT_PHONE: ${CONTACT_PHONE:-}
  CONTACT_EMAIL: ${CONTACT_EMAIL:-}
  CONTACT_WORKING_HOURS: ${CONTACT_WORKING_HOURS:-}

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fixpoint}
      MYSQL_USER: ${DB_USERNAME:-fixpoint}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_locally}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root_locally}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  # Migrations and seed run in a short-lived container. Seed credentials are
  # never part of the long-running Apache container environment.
  init:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-environment
      SEED_PASSWORD: ${SEED_PASSWORD:-FixPoint!Dev1}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_DATABASE: ${SEED_DATABASE:-true}
    command: ["php", "-r", "exit(0);"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8080}:80"
    # Strict allowlist: DB_ROOT_PASSWORD and SEED_PASSWORD are not passed here.
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
      SEED_DATABASE: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  db_data:
