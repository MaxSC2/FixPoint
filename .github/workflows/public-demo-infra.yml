name: Public demo infrastructure

on:
  push:
    branches:
      - feature/public-demo-oracle-2026-11-18
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  validate-config:
    name: Validate production Compose and Caddy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate merged production Compose configuration
        run: |
          docker compose --env-file deploy/env.demo.example \
            -f docker-compose.yml -f docker-compose.prod.yml \
            config --format json > /tmp/fixpoint-compose.json
          jq -e '(.services.app.environment | has("DB_ROOT_PASSWORD")) | not' /tmp/fixpoint-compose.json
          jq -e '(.services.app.environment | has("SEED_PASSWORD")) | not' /tmp/fixpoint-compose.json
          jq -e '(.services.init.environment | has("SEED_PASSWORD"))' /tmp/fixpoint-compose.json
          jq -e '([.services.app.ports[] | select(.target == 80 and .host_ip == "127.0.0.1")] | length) == 1' /tmp/fixpoint-compose.json
          jq -e '(.services.db.ports // []) | length == 0' /tmp/fixpoint-compose.json
          jq -e '([.services.caddy.ports[] | select(.target == 80 and .published == "80" and .protocol == "tcp")] | length) == 1' /tmp/fixpoint-compose.json
          jq -e '([.services.caddy.ports[] | select(.target == 443 and .published == "443" and .protocol == "tcp")] | length) == 1' /tmp/fixpoint-compose.json
          grep -Fxq "backups/" .dockerignore
          grep -Fxq "*.sql.gz" .dockerignore

      - name: Validate Caddyfile syntax
        run: |
          docker run --rm \
            -e DEMO_DOMAIN=fixpoint-demo.example.invalid \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  runtime:
    name: MySQL and app runtime secret boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use demo template for disposable CI database
        run: cp deploy/env.demo.example .env

      - name: Build and start application stack
        run: docker compose up -d --build

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - name: Assert bootstrap-only secrets are absent from Apache runtime
        run: |
          docker compose exec -T app sh -ec '
            test -z "${DB_ROOT_PASSWORD+x}"
            test -z "${MYSQL_ROOT_PASSWORD+x}"
            test -z "${SEED_PASSWORD+x}"
            test -n "${DB_PASSWORD:-}"
          '
          docker compose exec -T db sh -ec 'test -n "$MYSQL_ROOT_PASSWORD"'
          docker compose rm -f init

      - name: Stop disposable CI stack
        if: always()
        run: docker compose down --remove-orphans
