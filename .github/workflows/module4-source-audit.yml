name: Module 4 source audit\n\non:\n  pull_request:\n    branches: [develop]\n    paths:\n      - 'assignment/Модуль 4.docx'\n      - 'scripts/assignment/**'\n      - '.github/workflows/module4-source-audit.yml'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  extract-assignment:\n    name: Extract original rubric and check video captions\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n      - name: Set up Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n      - name: Install caption metadata utility\n        run: python -m pip install --disable-pip-version-check yt-dlp\n      - name: Extract DOCX and inspect video subtitle availability\n        run: >-\n          python scripts/assignment/extract_module4.py\n          --input 'assignment/Модуль 4.docx'\n          --output artifacts/module4\n          --check-video-captions\n      - name: Upload extracted requirements and subtitle availability report\n        uses: actions/upload-artifact@v4\n        with:\n          name: module4-source-audit-${{ github.run_number }}\n          path: artifacts/module4/\n          if-no-files-found: error\n          retention-days: 1\n