name: Module 4 source audit

on:
  pull_request:
    branches:
      - develop
    paths:
      - assignment/Модуль 4.docx
      - scripts/assignment/**
      - .github/workflows/module4-source-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-assignment:
    name: Extract original rubric and check video captions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install caption metadata utility
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Extract DOCX and inspect video subtitle availability
        run: python scripts/assignment/extract_module4.py --input 'assignment/Модуль 4.docx' --output artifacts/module4 --check-video-captions
      - name: Upload extracted requirements and subtitle availability report
        uses: actions/upload-artifact@v4
        with:
          name: module4-source-audit-${{ github.run_number }}
          path: artifacts/module4/
          if-no-files-found: error
          retention-days: 1
